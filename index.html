<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Mi Universo — un sistema solar 3D interactivo para niños de 3 a 6 años" />
  <title>🪐 Mi Universo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Lienzo 3D -->
  <canvas id="space" aria-label="Sistema solar en 3D"></canvas>

  <!-- Mensaje si no hay WebGL -->
  <div id="no-webgl" class="hidden" role="alert">
    <span class="big-emoji">🔭😢</span>
    <p>Este aparato no puede mostrar el espacio en 3D.</p>
  </div>

  <!-- Tarjeta del planeta (apoyo visual para pre-lectores) -->
  <div id="planet-card" class="hidden" aria-live="polite">
    <span id="card-emoji" class="card-emoji">🌍</span>
    <div class="card-text">
      <span id="card-name" class="card-name">Tierra</span>
      <div class="card-extras">
        <span id="card-temp" class="card-temp"></span>
        <span id="card-moons" class="card-moons"></span>
      </div>
    </div>
    <div id="card-mouth" class="card-mouth"></div>
  </div>

  <!-- Fase de la Luna en grande (modo fases 🌗): solo emoji, sin texto -->
  <div id="phase-overlay" class="hidden" aria-hidden="true">
    <span id="phase-emoji">🌕</span>
  </div>

  <!-- Botón flotante de eclipses (solo visible durante el modo fases) -->
  <button id="btn-eclipse" class="big-btn hidden" data-tip="¿Y si se alinean?"
          aria-label="Ver los eclipses: el Sol, la Luna y la Tierra en fila">🌞🌚</button>

  <!-- Botón flotante de escala real (solo visible con 📏 comparar activo) -->
  <button id="btn-scale" class="big-btn hidden" data-tip="¿Y las distancias de verdad?"
          aria-label="Ver las distancias de verdad entre los planetas">🏔</button>

  <!-- Botones grandes solo con iconos -->
  <nav id="toolbar" aria-label="Controles">
    <button id="btn-home"   class="big-btn" data-tip="Inicio" aria-label="Ver todo el universo">🏠</button>
    <button id="btn-galaxy" class="big-btn" data-tip="Galaxia" aria-label="Ver la galaxia, más allá del sistema solar">🌌</button>
    <button id="btn-tour"   class="big-btn" data-tip="Paseo guiado" aria-label="Paseo espacial guiado">🚀</button>
    <button id="btn-compare" class="big-btn" data-tip="Comparar tamaños" aria-label="Comparar tamaños de los planetas">📏</button>
    <button id="btn-games"  class="big-btn" data-tip="Juegos" aria-label="Juegos">🎮</button>
    <button id="btn-pause"  class="big-btn" data-tip="Pausar órbitas" aria-label="Pausar o mover los planetas">⏸️</button>
    <button id="btn-sound"  class="big-btn" data-tip="Sonido" aria-label="Sonido encendido o apagado">🔊</button>
    <button id="btn-style"  class="big-btn" data-tip="Colores y ajustes" aria-label="Cambiar colores y estrellas">🎨</button>
  </nav>

  <!-- Cajón de juegos (se abre con 🎮) -->
  <nav id="games-row" class="hidden" aria-label="Juegos">
    <button id="btn-quiz"  class="big-btn" data-tip="Quiz" aria-label="Juego de adivinar planetas">🎯</button>
    <button id="btn-levels" class="big-btn" data-tip="Niveles" aria-label="Quiz con niveles">🏆</button>
    <button id="btn-gravity" class="big-btn" data-tip="Salta la pelota" aria-label="Juego de la pelota que bota en cada planeta">🏀</button>
    <button id="btn-duo" class="big-btn" data-tip="Quiz de a dos" aria-label="Quiz para dos jugadores">👫</button>
    <button id="btn-album" class="big-btn" data-tip="Álbum" aria-label="Álbum de pegatinas">📒</button>
    <button id="btn-build" class="big-btn" data-tip="Crea tu planeta" aria-label="Construye tu planeta">🪐</button>
  </nav>

  <!-- Elegir jugadores del quiz de a dos 👫 (reusa estilos de la bienvenida) -->
  <div id="duo-picker" class="hidden" aria-label="Elige con quién juegas">
    <p class="welcome-title">¿Quién juega contigo? 👫</p>
    <div id="duo-list" class="welcome-profiles"></div>
    <button id="duo-close" class="big-btn duo-close" data-tip="Cerrar" aria-label="Cerrar">❌</button>
  </div>

  <!-- Banner de turno del quiz de a dos (avatar grande + nombre) -->
  <div id="turn-banner" class="hidden" aria-live="polite">
    <span id="turn-avatar">🧑‍🚀</span>
    <span id="turn-name">…</span>
    <span class="turn-label">¡Te toca!</span>
  </div>

  <!-- Panel de personalización (solo iconos) -->
  <div id="style-panel" class="hidden side-panel" aria-label="Personalizar">
    <div class="panel-row" data-tip="Velocidad" aria-label="Velocidad de los planetas">
      <span class="row-icon">🐢</span>
      <input id="speed-slider" type="range" min="0" max="3" step="0.05" value="1" aria-label="Velocidad de las órbitas" />
      <span class="row-icon">🐇</span>
    </div>
    <div class="panel-row" aria-label="Cantidad de estrellas">
      <span class="row-icon">✨</span>
      <button class="mini-btn star-opt" data-stars="low"    data-tip="Pocas estrellas" aria-label="Pocas estrellas">·</button>
      <button class="mini-btn star-opt" data-stars="normal" data-tip="Estrellas normales" aria-label="Estrellas normales">✳️</button>
      <button class="mini-btn star-opt" data-stars="high"   data-tip="Muchas estrellas" aria-label="Muchas estrellas">🌌</button>
    </div>
    <div class="panel-row" aria-label="Color del cielo">
      <button class="swatch" data-sky="#03020f" style="background:#03020f" data-tip="Cielo negro" aria-label="Cielo negro"></button>
      <button class="swatch" data-sky="#0b1035" style="background:#0b1035" data-tip="Cielo azul noche" aria-label="Cielo azul noche"></button>
      <button class="swatch" data-sky="#1a0b2e" style="background:#1a0b2e" data-tip="Cielo morado" aria-label="Cielo morado"></button>
      <button class="swatch" data-sky="#06201c" style="background:#06201c" data-tip="Cielo verde oscuro" aria-label="Cielo verde oscuro"></button>
    </div>
    <div class="panel-row" aria-label="Luz ambiental">
      <button class="mini-btn amb-opt" data-amb="night" data-tip="Noche" aria-label="Noche">🌙</button>
      <button class="mini-btn amb-opt" data-amb="warm"  data-tip="Atardecer" aria-label="Atardecer">🌅</button>
      <button class="mini-btn amb-opt" data-amb="day"   data-tip="Día" aria-label="Día">☀️</button>
    </div>
    <div class="panel-row" aria-label="Mostrar u ocultar cosas">
      <button id="toggle-orbits" class="mini-btn" data-tip="Líneas de órbita" aria-label="Mostrar líneas de órbita">⭕</button>
      <button id="toggle-labels" class="mini-btn" data-tip="Nombres de planetas" aria-label="Mostrar nombres de los planetas">🔤</button>
      <button id="toggle-captions" class="mini-btn" data-tip="Subtítulos" aria-label="Mostrar subtítulos de lo que se dice">💬</button>
    </div>
    <div class="panel-row" aria-label="Estado de Boti (para los grandes)">
      <span id="chip-mic"   class="status-chip" data-tip="Micrófono" aria-label="Estado del micrófono">🎤✅</span>
      <span id="chip-brain" class="status-chip" data-tip="Cerebro" aria-label="Cerebro de Boti">🧠📚</span>
      <span id="chip-voice" class="status-chip" data-tip="Voz" aria-label="Voz de Boti">🗣️📱</span>
    </div>
  </div>

  <!-- Panel "construye tu planeta" 🪐 (solo iconos) -->
  <div id="build-panel" class="hidden side-panel" aria-label="Construye tu planeta">
    <div class="panel-row" aria-label="Color de tu planeta">
      <button class="swatch build-color" data-color="#e84d6f" style="background:#e84d6f" data-tip="Rosa" aria-label="Rosa"></button>
      <button class="swatch build-color" data-color="#43c465" style="background:#43c465" data-tip="Verde" aria-label="Verde"></button>
      <button class="swatch build-color" data-color="#4f8cff" style="background:#4f8cff" data-tip="Azul" aria-label="Azul"></button>
      <button class="swatch build-color" data-color="#c77dff" style="background:#c77dff" data-tip="Morado" aria-label="Morado"></button>
      <button class="swatch build-color" data-color="#ffb15e" style="background:#ffb15e" data-tip="Naranja" aria-label="Naranja"></button>
    </div>
    <div class="panel-row" data-tip="Tamaño" aria-label="Tamaño de tu planeta">
      <span class="row-icon">🐜</span>
      <input id="build-size" type="range" min="0.8" max="4" step="0.1" value="1.8" aria-label="Tamaño" />
      <span class="row-icon">🐘</span>
    </div>
    <div class="panel-row" aria-label="Anillos y lunas">
      <button id="build-rings" class="mini-btn" data-tip="Anillos" aria-label="Anillos sí o no">💍</button>
      <button id="build-moons" class="mini-btn" data-tip="Lunas" aria-label="Cuántas lunas">🌙<sub id="build-moons-n">0</sub></button>
    </div>
    <div class="panel-row" aria-label="Crear o quitar">
      <button id="build-go" class="mini-btn build-go" data-tip="¡Crear mi planeta!" aria-label="¡Crear mi planeta!">✨</button>
      <button id="build-del" class="mini-btn" data-tip="Quitar el último planeta" aria-label="Quitar mi último planeta">🗑️</button>
    </div>
  </div>

  <!-- Álbum de pegatinas 📒 -->
  <div id="album" class="hidden" aria-label="Álbum de pegatinas">
    <div id="album-grid"></div>
    <div class="album-actions">
      <button id="btn-print" class="big-btn" data-tip="Mi pasaporte" aria-label="Imprimir mi pasaporte espacial">🖨️</button>
      <button id="album-close" class="big-btn album-close" data-tip="Cerrar" aria-label="Cerrar álbum">❌</button>
    </div>
  </div>

  <!-- Pasaporte espacial 🖨️ (pantalla: overlay; papel: página A4 vía @media print) -->
  <div id="passport" class="hidden" aria-label="Pasaporte espacial">
    <div id="passport-page"></div>
    <button id="passport-close" class="big-btn passport-close" data-tip="Cerrar" aria-label="Cerrar pasaporte">❌</button>
  </div>

  <!-- Pegatina nueva (animación de desbloqueo) -->
  <div id="sticker-pop" class="hidden" aria-live="polite">
    <span id="sticker-pop-emoji">⭐</span>
  </div>

  <!-- Subtítulos 💬 de lo que se narra (se activan en el panel 🎨) -->
  <div id="caption" class="hidden" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
